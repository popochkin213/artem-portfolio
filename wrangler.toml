# Cloudflare Pages: проект и папка сборки.
# Секреты (TELEGRAM_BOT_TOKEN и др.) задаются в панели Cloudflare,
# а не в этом файле.
name = "artem-portfolio"
compatibility_date = "2026-11-26"
pages_build_output_dir = "dist"

# KV для счётчика посетителей подключается в панели Cloudflare:
# Workers & Pages → KV → создать namespace → привязать как STATS.
# Без KV счётчик работает в памяти и сбрасывается.
