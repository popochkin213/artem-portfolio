<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд заказов</title>
<meta name="description" content="Таблица заказов с поиском, фильтрами, сортировкой и выгрузкой в CSV.">

<meta property="og:title" content="Дашборд заказов">
<meta property="og:description" content="Таблица заказов с поиском, фильтрами, сортировкой и выгрузкой в CSV.">
<meta property="og:url" content="https://artem-portfolio-7m4.pages.dev/cases/dashboard/">
<meta property="og:locale" content="ru_RU">
<meta property="og:image" content="https://artem-portfolio-7m4.pages.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Дашборд заказов">
<meta name="twitter:description" content="Таблица с поиском, фильтрами, сортировкой и выгрузкой в CSV.">
<meta name="twitter:image" content="https://artem-portfolio-7m4.pages.dev/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0a0a10;
    --panel: #13131c;
    --panel-2: #1a1a26;
    --line: #24243a;
    --text: #f1f1f6;
    --muted: #8f8fa8;
    --accent: #7c5cff;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 32px 20px 60px;
  }

  .page { max-width: 1180px; margin: 0 auto; }

  /* Плашка возврата в портфолио */
  .back-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    font-size: 13px; color: var(--muted);
  }
  .back-bar a { color: var(--text); text-decoration: none; }
  .back-bar a:hover { color: var(--accent); }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .top h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; font-weight: 800; }
  .top p { margin: 0; color: var(--muted); font-size: 14px; }

  .btn {
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .btn:hover { border-color: var(--accent); background: rgba(124, 92, 255, .12); }

  /* KPI */
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .kpi-card span { display: block; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .kpi-card b { display: block; font-size: 25px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }

  /* панель фильтров */
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 14px 16px;
    border-bottom: 0;
  }
  .toolbar input[type="search"], .toolbar select {
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #0d0d15;
    color: var(--text);
    font: inherit;
    font-size: 14px;
  }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 160px; }
  .toolbar input:focus, .toolbar select:focus { outline: 2px solid rgba(124, 92, 255, .4); border-color: var(--accent); }
  .counter { margin-left: auto; font-size: 13px; color: var(--muted); }

  /* таблица */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 0 0 14px 14px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  thead th {
    text-align: left;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 600;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  thead th[data-sort] { cursor: pointer; user-select: none; }
  thead th[data-sort]:hover { color: var(--text); }
  thead th .arrow { color: var(--accent); font-size: 10px; margin-left: 4px; }

  tbody td { padding: 13px 16px; border-bottom: 1px solid #1c1c2b; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #171724; }

  .id { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sum { font-weight: 600; font-variant-numeric: tabular-nums; }
  .client b { display: block; font-weight: 600; }
  .client small { color: var(--muted); font-size: 12.5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.new { color: var(--blue); background: rgba(96, 165, 250, .13); }
  .badge.work { color: var(--yellow); background: rgba(251, 191, 36, .13); }
  .badge.done { color: var(--green); background: rgba(52, 211, 153, .13); }
  .badge.cancel { color: var(--red); background: rgba(248, 113, 113, .13); }

  .empty { padding: 44px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    body { padding: 22px 12px 40px; }
    .top h1 { font-size: 22px; }
    .counter { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="back-bar">
    <a href="/" target="_top">← Все проекты</a>
    <span>демо-кейс · Артём Соколов</span>
  </div>

  <div class="top">
    <div>
      <h1>Заказы</h1>
      <p>Демо-дашборд: поиск, фильтры, сортировка, выгрузка в CSV</p>
    </div>
    <button class="btn" id="export">Выгрузить CSV</button>
  </div>

  <div class="kpi">
    <div class="kpi-card"><span>Всего заказов</span><b id="kpi-count">—</b></div>
    <div class="kpi-card"><span>Выручка</span><b id="kpi-revenue">—</b></div>
    <div class="kpi-card"><span>Средний чек</span><b id="kpi-avg">—</b></div>
    <div class="kpi-card"><span>Отменено</span><b id="kpi-cancel">—</b></div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Поиск по клиенту или номеру заказа">
    <select id="status">
      <option value="">Все статусы</option>
      <option value="new">Новый</option>
      <option value="work">В работе</option>
      <option value="done">Выполнен</option>
      <option value="cancel">Отменён</option>
    </select>
    <span class="counter" id="counter"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="id">№<span class="arrow"></span></th>
          <th>Клиент</th>
          <th data-sort="date">Дата<span class="arrow"></span></th>
          <th>Статус</th>
          <th data-sort="sum">Сумма<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Ничего не найдено</div>
  </div>

</div>

<script>
  // --- данные (демо) ---
  const NAMES = [
    ['Иван Петров', 'ivan@mail.ru'], ['Мария Соколова', '@maria_s'],
    ['Алексей Кузнецов', 'kuznetsov@bk.ru'], ['Ольга Смирнова', '@olga_sm'],
    ['Дмитрий Волков', 'volkov@yandex.ru'], ['Анна Морозова', '@anna_m'],
    ['Сергей Новиков', 'novikov@mail.ru'], ['Екатерина Орлова', '@kate_orl'],
    ['Павел Зайцев', 'zaytsev@bk.ru'], ['Наталья Крылова', '@nat_kryl'],
  ];
  const STATUSES = ['new', 'work', 'done', 'cancel'];
  const STATUS_LABEL = { new: 'Новый', work: 'В работе', done: 'Выполнен', cancel: 'Отменён' };

  function makeOrders(count) {
    const list = [];
    const today = new Date();

    for (let i = 1; i <= count; i += 1) {
      const [name, contact] = NAMES[i % NAMES.length];
      const daysAgo = Math.floor(Math.random() * 60);
      const date = new Date(today);
      date.setDate(date.getDate() - daysAgo);

      list.push({
        id: 1040 + i,
        name,
        contact,
        date: date.toISOString().slice(0, 10),
        status: STATUSES[Math.floor(Math.random() * STATUSES.length)],
        sum: 2000 + Math.floor(Math.random() * 60) * 500,
      });
    }
    return list;
  }

  const orders = makeOrders(42);

  // --- состояние ---
  const state = { search: '', status: '', sortKey: 'id', sortDir: 'desc' };

  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');
  const counterEl = document.getElementById('counter');

  const money = (n) => n.toLocaleString('ru-RU') + ' ₽';
  const dateRu = (iso) => iso.split('-').reverse().join('.');

  // --- отрисовка ---
  function render() {
    const q = state.search.trim().toLowerCase();

    let visible = orders.filter((order) => {
      const matchesSearch = !q
        || order.name.toLowerCase().includes(q)
        || order.contact.toLowerCase().includes(q)
        || String(order.id).includes(q);
      const matchesStatus = !state.status || order.status === state.status;
      return matchesSearch && matchesStatus;
    });

    visible.sort((a, b) => {
      const dir = state.sortDir === 'asc' ? 1 : -1;
      const key = state.sortKey;
      if (key === 'sum') return (a.sum - b.sum) * dir;
      if (key === 'date') return a.date.localeCompare(b.date) * dir;
      return (a.id - b.id) * dir;
    });

    rowsEl.innerHTML = visible.map((order) => `
      <tr>
        <td class="id">#${order.id}</td>
        <td class="client"><b>${order.name}</b><small>${order.contact}</small></td>
        <td>${dateRu(order.date)}</td>
        <td><span class="badge ${order.status}">${STATUS_LABEL[order.status]}</span></td>
        <td class="sum">${money(order.sum)}</td>
      </tr>
    `).join('');

    emptyEl.hidden = visible.length > 0;
    counterEl.textContent = `Показано ${visible.length} из ${orders.length}`;

    // KPI считаем по всем заказам, а не по отфильтрованным
    const revenue = orders
      .filter((o) => o.status !== 'cancel')
      .reduce((acc, o) => acc + o.sum, 0);
    const paid = orders.filter((o) => o.status !== 'cancel');

    document.getElementById('kpi-count').textContent = orders.length;
    document.getElementById('kpi-revenue').textContent = money(revenue);
    document.getElementById('kpi-avg').textContent = money(Math.round(revenue / paid.length));
    document.getElementById('kpi-cancel').textContent =
      orders.filter((o) => o.status === 'cancel').length;

    // стрелки сортировки
    document.querySelectorAll('th[data-sort]').forEach((th) => {
      const arrow = th.querySelector('.arrow');
      arrow.textContent = th.dataset.sort === state.sortKey
        ? (state.sortDir === 'asc' ? '▲' : '▼')
        : '';
    });
  }

  // --- события ---
  document.getElementById('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    render();
  });

  document.getElementById('status').addEventListener('change', (e) => {
    state.status = e.target.value;
    render();
  });

  document.querySelectorAll('th[data-sort]').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'desc';
      }
      render();
    });
  });

  // --- экспорт CSV ---
  document.getElementById('export').addEventListener('click', () => {
    const header = 'Номер;Клиент;Контакт;Дата;Статус;Сумма\n';
    const body = orders.map((o) => [
      o.id, o.name, o.contact, dateRu(o.date), STATUS_LABEL[o.status], o.sum,
    ].join(';')).join('\n');

    // BOM нужен, чтобы Excel открыл кириллицу без кракозябр
    const blob = new Blob(['\uFEFF' + header + body], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'orders.csv';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  render();
</script>
</body>
</html>
