<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор стоимости сайта</title>
<meta name="description" content="Соберите конфигурацию сайта и сразу увидите стоимость. Расчёт можно отправить разработчику.">
<meta name="turnstile-site-key" content="">
<link rel="canonical" href="https://artem-portfolio-7m4.pages.dev/cases/calculator/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0b11;
    --panel: #14141d;
    --panel-2: #1b1b26;
    --line: #26263a;
    --text: #f2f2f7;
    --muted: #9797ad;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --ok: #34d399;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(900px 500px at 50% -180px, rgba(124, 92, 255, .22), transparent 65%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    padding: 44px 20px 70px;
  }

  .page { max-width: 980px; margin: 0 auto; }

  /* Плашка возврата в портфолио */
  .back-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    font-size: 13px; color: var(--muted);
  }
  .back-bar a { color: var(--text); text-decoration: none; }
  .back-bar a:hover { color: var(--accent); }

  .head { text-align: center; margin-bottom: 38px; }
  .head h1 {
    font-size: clamp(26px, 4.4vw, 40px);
    letter-spacing: -.03em;
    margin: 0 0 12px;
    font-weight: 800;
  }
  .head p { margin: 0; color: var(--muted); font-size: 16px; }

  .layout {
    display: grid;
    grid-template-columns: 1.35fr .65fr;
    gap: 22px;
    align-items: start;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px;
  }

  .group + .group { margin-top: 26px; }

  .group-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* типы сайтов */
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .type {
    position: relative;
    padding: 16px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel-2);
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .12s;
  }
  .type:hover { transform: translateY(-2px); }
  .type input { position: absolute; opacity: 0; pointer-events: none; }
  .type span { display: block; font-weight: 600; font-size: 15px; }
  .type small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .type:has(input:checked) {
    border-color: var(--accent);
    background: rgba(124, 92, 255, .13);
  }

  /* ползунок */
  .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .slider-row b { font-size: 15px; }
  .slider-row output { color: var(--accent-2); font-weight: 700; }

  input[type="range"] {
    width: 100%;
    height: 6px;
    appearance: none;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    cursor: pointer;
  }

  /* опции */
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel-2);
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color .18s;
  }
  .option:hover { border-color: #3a3a55; }
  .option input { margin-top: 3px; accent-color: var(--accent); width: 17px; height: 17px; }
  .option b { display: block; font-size: 14.5px; font-weight: 600; }
  .option small { color: var(--muted); font-size: 13px; }
  .option:has(input:checked) { border-color: var(--accent); }

  /* итог */
  .total-card {
    position: sticky;
    top: 22px;
    background: linear-gradient(160deg, #17172a, #12121b);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px;
  }
  .total-label { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .total-value {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -.03em;
    margin: 6px 0 4px;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .total-note { font-size: 13px; color: var(--muted); margin: 0 0 20px; }

  .breakdown { border-top: 1px solid var(--line); padding-top: 16px; margin-bottom: 20px; font-size: 14px; }
  .breakdown div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; color: var(--muted); }
  .breakdown div span:last-child { color: var(--text); white-space: nowrap; }

  .btn {
    width: 100%;
    padding: 14px 18px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(100deg, var(--accent), #6d4dff);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 10px 26px -12px rgba(124, 92, 255, .9);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #0d0d14;
    color: var(--text);
    font: inherit;
    font-size: 14.5px;
  }
  .field input:focus { outline: 2px solid rgba(124, 92, 255, .4); border-color: var(--accent); }

  .status { min-height: 20px; margin: 12px 0 0; font-size: 13.5px; color: var(--ok); text-align: center; }
  .status.err { color: #f87171; }

  .hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .consent {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 0 14px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    cursor: pointer;
  }

  .consent input {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin: 2px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .consent a { color: var(--accent); }
  .consent--invalid { color: #f87171; }

  .turnstile-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
    margin: 4px 0 12px;
    min-height: 66px;
  }
  .turnstile-wrap[hidden] { display: none; }
  .turnstile-wrap > div { max-width: 100%; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .total-card { position: static; }
    .types { grid-template-columns: 1fr; }
    body { padding: 28px 14px 50px; }
    .card, .total-card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="back-bar">
    <a href="/" target="_top">← Все проекты</a>
    <span>демо-кейс · Артём Соколов</span>
  </div>

  <div class="head">
    <h1>Сколько стоит ваш сайт</h1>
    <p>Соберите конфигурацию — цена посчитается сразу. Без звонков и «уточним позже».</p>
  </div>

  <div class="layout">

    <div class="card">

      <div class="group">
        <div class="group-title">Тип сайта</div>
        <div class="types">
          <label class="type">
            <input type="radio" name="type" value="landing" checked>
            <span>Лендинг</span>
            <small>одна страница</small>
          </label>
          <label class="type">
            <input type="radio" name="type" value="corporate">
            <span>Корпоративный</span>
            <small>5–10 страниц</small>
          </label>
          <label class="type">
            <input type="radio" name="type" value="shop">
            <span>Магазин</span>
            <small>каталог + корзина</small>
          </label>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Объём</div>
        <div class="slider-row">
          <b>Страниц в проекте</b>
          <output id="pages-out">1</output>
        </div>
        <input id="pages" type="range" min="1" max="20" value="1" step="1">
      </div>

      <div class="group">
        <div class="group-title">Что нужно</div>

        <label class="option">
          <input type="checkbox" name="opt" value="responsive" checked>
          <span><b>Адаптив под телефоны</b><small>вёрстка под все экраны</small></span>
        </label>

        <label class="option">
          <input type="checkbox" name="opt" value="animation">
          <span><b>Анимации и интерактив</b><small>появление блоков, hover-эффекты</small></span>
        </label>

        <label class="option">
          <input type="checkbox" name="opt" value="crm">
          <span><b>Заявки в CRM / Telegram</b><small>форма сразу шлёт уведомления</small></span>
        </label>

        <label class="option">
          <input type="checkbox" name="opt" value="seo">
          <span><b>Базовая SEO-оптимизация</b><small>мета-теги, скорость, разметка</small></span>
        </label>

        <label class="option">
          <input type="checkbox" name="opt" value="copy">
          <span><b>Тексты и структура</b><small>напишу продающие тексты</small></span>
        </label>
      </div>

      <div class="group">
        <div class="group-title">Сроки</div>
        <div class="types" style="grid-template-columns:1fr 1fr">
          <label class="type">
            <input type="radio" name="speed" value="normal" checked>
            <span>Обычные</span>
            <small>2–3 недели</small>
          </label>
          <label class="type">
            <input type="radio" name="speed" value="fast">
            <span>Срочно</span>
            <small>+30% к цене</small>
          </label>
        </div>
      </div>

    </div>

    <aside class="total-card">
      <div class="total-label">Примерная стоимость</div>
      <div class="total-value" id="total">15 000 ₽</div>
      <p class="total-note">Точная цена — после обсуждения задачи.</p>

      <div class="breakdown" id="breakdown"></div>

      <form id="lead-form">
        <div class="hp" aria-hidden="true">
          <label for="website">Сайт</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" placeholder="Как к вам обращаться" required>
        </div>
        <div class="field">
          <label for="contact">Email или Telegram</label>
          <input id="contact" name="contact" type="text" placeholder="you@mail.ru или @nick" required>
        </div>

        <label class="consent">
          <input type="checkbox" name="consent">
          <span>
            Согласен с <a href="/privacy" target="_blank" rel="noopener">политикой конфиденциальности</a>
            и <a href="/terms" target="_blank" rel="noopener">условиями соглашения</a>.
          </span>
        </label>

        <div class="turnstile-wrap" id="turnstile-wrap" hidden>
          <div id="turnstile"></div>
        </div>

        <button class="btn" type="submit">Отправить расчёт</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </aside>

  </div>
</div>

<script src="/turnstile.js"></script>
<script>
  const BASE = { landing: 15000, corporate: 35000, shop: 60000 };
  const PER_PAGE = 3000;
  const OPTIONS = {
    responsive: { label: 'Адаптив', price: 5000 },
    animation:  { label: 'Анимации', price: 4000 },
    crm:        { label: 'Заявки в CRM', price: 8000 },
    seo:        { label: 'SEO', price: 6000 },
    copy:       { label: 'Тексты', price: 5000 },
  };

  const form = document.getElementById('lead-form');
  const formLoadedAt = Date.now();
  const pagesInput = document.getElementById('pages');
  const pagesOut = document.getElementById('pages-out');
  const totalEl = document.getElementById('total');
  const breakdownEl = document.getElementById('breakdown');
  const statusEl = document.getElementById('status');

  const money = (n) => n.toLocaleString('ru-RU') + ' ₽';

  function calculate() {
    const type = document.querySelector('input[name="type"]:checked').value;
    const speed = document.querySelector('input[name="speed"]:checked').value;
    const pages = Number(pagesInput.value);

    const items = [{ label: 'Базовый пакет', price: BASE[type] }];

    if (pages > 1) {
      items.push({ label: `Доп. страницы (${pages - 1})`, price: (pages - 1) * PER_PAGE });
    }

    document.querySelectorAll('input[name="opt"]:checked').forEach((box) => {
      const opt = OPTIONS[box.value];
      items.push({ label: opt.label, price: opt.price });
    });

    let sum = items.reduce((acc, item) => acc + item.price, 0);

    if (speed === 'fast') {
      const extra = Math.round(sum * 0.3);
      items.push({ label: 'Срочность +30%', price: extra });
      sum += extra;
    }

    pagesOut.textContent = pages;
    totalEl.textContent = money(sum);
    breakdownEl.innerHTML = items
      .map((item) => `<div><span>${item.label}</span><span>${money(item.price)}</span></div>`)
      .join('');

    return { type, speed, pages, sum, items };
  }

  document.addEventListener('input', calculate);
  document.addEventListener('change', calculate);
  calculate();

  // Отправляем расчёт на сервер — он перешлёт в Telegram
  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const name = form.elements.name.value.trim();
    const contact = form.elements.contact.value.trim();

    if (name.length < 2) {
      statusEl.textContent = 'Укажите имя';
      statusEl.classList.add('err');
      return;
    }
    if (contact.length < 3) {
      statusEl.textContent = 'Укажите контакт';
      statusEl.classList.add('err');
      return;
    }
    if (!form.elements.consent.checked) {
      statusEl.textContent = 'Поставьте галочку согласия';
      statusEl.classList.add('err');
      form.querySelector('.consent').classList.add('consent--invalid');
      return;
    }
    form.querySelector('.consent').classList.remove('consent--invalid');

    const turnstile = window.PortfolioTurnstile;
    if (turnstile && turnstile.required() && !turnstile.getToken()) {
      statusEl.textContent = 'Подтвердите, что вы человек, и отправьте ещё раз';
      statusEl.classList.add('err');
      return;
    }

    const { type, speed, pages, sum, items } = calculate();
    const typeNames = { landing: 'Лендинг', corporate: 'Корпоративный', shop: 'Магазин' };

    const message = [
      'Расчёт с калькулятора:',
      `Тип: ${typeNames[type]}`,
      `Страниц: ${pages}`,
      `Сроки: ${speed === 'fast' ? 'срочно' : 'обычные'}`,
      '',
      ...items.map((i) => `• ${i.label} — ${money(i.price)}`),
      '',
      `Итого: ${money(sum)}`,
    ].join('\n');

    const button = form.querySelector('button');
    button.disabled = true;
    statusEl.classList.remove('err');
    statusEl.textContent = 'Отправляем…';

    try {
      const response = await fetch('/api/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          contact,
          service: `Расчёт: ${typeNames[type]} — ${money(sum)}`,
          payment: 'Обсудим',
          message,
          consent: true,
          website: form.elements.website.value,
          elapsed: Date.now() - formLoadedAt,
          turnstileToken: turnstile ? turnstile.getToken() : '',
        }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || 'Ошибка');

      statusEl.textContent = 'Расчёт отправлен! Свяжусь с вами.';
      form.reset();
      if (turnstile) turnstile.reset();
    } catch (error) {
      console.error(error);
      statusEl.textContent = 'Не получилось отправить. Попробуйте позже.';
      statusEl.classList.add('err');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
