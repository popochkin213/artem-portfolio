name: Keep Render awake

# Render на бесплатном тарифе усыпляет сервис после 15 минут простоя.
# Этот workflow пингует сайт каждые 10 минут и не даёт ему заснуть.

on:
  schedule:
    # каждые 10 минут (GitHub может задержать запуск на несколько минут)
    - cron: "*/10 * * * *"
  workflow_dispatch: # можно запустить вручную из вкладки Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site
        run: |
          URL="https://artem-portfolio-xywf.onrender.com/"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "Попытка $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Сайт проснулся и отвечает."
              exit 0
            fi
            sleep 20
          done
          echo "Сайт не ответил, но это не ошибка сборки — просто пропускаем."
          exit 0
