name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://artem-portfolio-7m4.pages.dev
          TURNSTILE_SITE_KEY: 0x4AAAAAAGUNSQCMeSBZiDW5
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name artem-portfolio --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 122569f81dceb2192192721459d0cba4

      - name: IndexNow
        run: node scripts/indexnow.js
        env:
          SITE_URL: https://artem-portfolio-7m4.pages.dev
